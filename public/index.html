<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulaar-Translate — Traducteur Français ↔ Pulaar (Fuuta Tooro)</title>
<meta name="description" content="Traducteur automatique français ↔ pulaar, dialecte Fuuta Tooro. Modèle NLLB affiné sur un corpus validé par des locuteurs natifs. Gratuit.">
<link rel="canonical" href="https://www.pulaar-translate.com/">
<meta property="og:title" content="Pulaar-Translate — Traducteur Français ↔ Pulaar">
<meta property="og:description" content="Traduction automatique français ↔ pulaar, dialecte Fuuta Tooro.">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://www.pulaar-translate.com/">
<meta property="og:site_name" content="Pulaar-Translate">
<meta property="og:image" content="https://www.pulaar-translate.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pulaar-Translate — traducteur français ↔ pulaar, dialecte Fuuta Tooro">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.pulaar-translate.com/og-image.png">
<meta name="twitter:title" content="Pulaar-Translate — Traducteur Français ↔ Pulaar">
<meta name="twitter:description" content="Traduction automatique français ↔ pulaar, dialecte Fuuta Tooro. Gratuit.">
<meta name="theme-color" content="#4c58d4">
<style>
  :root{
    --encre:#141b2d; --doux:#5b6579; --trait:#e2e6ee;
    --fond:#fbfcfe; --carte:#fff; --accent:#4c58d4; --accent-clair:#eef0ff;
    --alerte:#9a3d12; --alerte-fond:#fff4ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --encre:#e9edf5; --doux:#9aa4b8; --trait:#2a3141;
      --fond:#0f131c; --carte:#161b27; --accent:#8b95f5; --accent-clair:#1e2235;
      --alerte:#f0b487; --alerte-fond:#2a1f16;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fond); color:var(--encre);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .page{max-width:900px; margin:0 auto; padding:32px 20px 64px}
  header{margin-bottom:28px}
  .haut{display:flex; justify-content:space-between; align-items:flex-start;
        gap:16px; flex-wrap:wrap}
  h1{font-size:1.65rem; margin:0 0 6px; letter-spacing:-.02em}
  .sous{color:var(--doux); margin:0 0 4px}
  .credits{color:var(--doux); font-size:.85rem; margin:10px 0 0}
  .langues{display:flex; gap:6px; flex-shrink:0}
  .langues button{
    font:inherit; font-size:.82rem; font-weight:600; padding:6px 13px;
    border:1px solid var(--trait); background:transparent; color:var(--doux);
    border-radius:99px; cursor:pointer;
  }
  .langues button[aria-pressed="true"]{
    background:var(--accent-clair); color:var(--accent); border-color:transparent;
  }
  .avis{
    background:var(--alerte-fond); color:var(--alerte); border:1px solid currentColor;
    border-radius:10px; padding:11px 14px; font-size:.88rem; margin:18px 0 0;
  }
  .grille{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:22px}
  @media (max-width:720px){ .grille{grid-template-columns:1fr} }
  .carte{background:var(--carte); border:1px solid var(--trait); border-radius:14px; padding:16px}
  label{display:block; font-size:.78rem; font-weight:600; text-transform:uppercase;
        letter-spacing:.04em; color:var(--doux); margin-bottom:8px}
  textarea,select{
    width:100%; font:inherit; color:inherit; background:transparent;
    border:1px solid var(--trait); border-radius:9px; padding:11px;
  }
  textarea{min-height:160px; resize:vertical}
  textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px;
                              border-color:transparent}
  #sortie{white-space:pre-wrap; min-height:160px; margin:0}
  #sortie.vide{color:var(--doux)}
  .barre{display:flex; gap:10px; align-items:end; margin-top:14px; flex-wrap:wrap}
  .barre > div{flex:1; min-width:180px}
  button{
    font:inherit; font-weight:600; border:0; border-radius:9px;
    padding:11px 22px; cursor:pointer; background:var(--accent); color:#fff;
  }
  button:disabled{opacity:.55; cursor:progress}
  button.secondaire{background:var(--accent-clair); color:var(--accent)}
  .etat{margin-top:12px; font-size:.88rem; color:var(--doux); min-height:1.4em}
  .etat.erreur{color:var(--alerte)}
  .compteur{font-size:.78rem; color:var(--doux); text-align:right; margin-top:6px}

  /* Retours ---------------------------------------------------------------
     Le bloc vit sous la traduction et n'apparaît qu'une fois qu'il y en a une
     à juger. Les deux réponses ont le même poids visuel : un « non » plus
     discret que le « oui » fausserait ce qu'on cherche à mesurer. */
  .retour{margin-top:18px; padding-top:16px; border-top:1px solid var(--trait)}
  .retour-q{margin:0 0 10px; font-size:.88rem; font-weight:600}
  .retour-choix{display:flex; gap:8px; flex-wrap:wrap}
  .retour-choix button{font-size:.85rem; padding:8px 16px}
  .retour form{margin-top:16px; display:grid; gap:12px}
  .retour textarea{min-height:84px}
  .retour input,.retour select{
    width:100%; font:inherit; color:inherit; background:transparent;
    border:1px solid var(--trait); border-radius:9px; padding:10px;
  }
  .retour input:focus{outline:2px solid var(--accent); outline-offset:1px;
                      border-color:transparent}
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:520px){ .duo{grid-template-columns:1fr} }
  .mention{font-size:.78rem; color:var(--doux); margin:0}
  .retour-etat{font-size:.85rem; margin:10px 0 0; min-height:1.3em; color:var(--doux)}
  .retour-etat.ok{color:var(--accent)}
  .retour-etat.erreur{color:var(--alerte)}

  footer{margin-top:40px; padding-top:20px; border-top:1px solid var(--trait);
         color:var(--doux); font-size:.85rem}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="haut">
      <div>
        <h1 data-i18n="titre"></h1>
        <p class="sous" data-i18n="accroche"></p>
        <p class="credits">
          Hamath Kane, Abou Sy, Bocar Amadou Ba (ARPRIM) &amp; Alassane Mountaga Sall « Dembel »
        </p>
      </div>
      <nav class="langues" id="langues"></nav>
    </div>
    <p class="avis">⏳ <span data-i18n="avis"></span></p>
  </header>

  <main class="grille">
    <section class="carte">
      <label for="source" data-i18n="label.source"></label>
      <textarea id="source" maxlength="1000"></textarea>
      <p class="compteur"><span id="compteur">0</span> / 1000</p>
      <div class="barre">
        <div>
          <label for="direction" data-i18n="label.direction"></label>
          <select id="direction">
            <option value="fr → pul" data-i18n="dir.fr_pul"></option>
            <option value="pul → fr" data-i18n="dir.pul_fr"></option>
          </select>
        </div>
        <button type="button" id="traduire" data-i18n="btn.traduire"></button>
        <button type="button" id="effacer" class="secondaire" data-i18n="btn.effacer"></button>
      </div>
      <p class="etat" id="etat" role="status" aria-live="polite"></p>
    </section>

    <section class="carte">
      <label for="sortie" data-i18n="label.traduction"></label>
      <p id="sortie" class="vide"></p>

      <div class="retour" id="retour" hidden>
        <p class="retour-q" data-i18n="retour.question"></p>
        <div class="retour-choix">
          <button type="button" class="secondaire" id="retour-oui"
                  data-i18n="retour.oui"></button>
          <button type="button" class="secondaire" id="retour-non"
                  data-i18n="retour.non"></button>
        </div>

        <form id="retour-form" hidden>
          <div>
            <label for="retour-correction" data-i18n="retour.correction"></label>
            <textarea id="retour-correction" maxlength="2000"></textarea>
          </div>
          <div>
            <label for="retour-nom" data-i18n="retour.nom"></label>
            <input id="retour-nom" maxlength="80" autocomplete="off">
          </div>
          <p class="mention">
            <span data-i18n="retour.fuuta"></span>
            <span data-i18n="retour.avis"></span>
          </p>
          <div><button type="submit" data-i18n="retour.envoyer"></button></div>
        </form>

        <p class="retour-etat" id="retour-etat" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>
      <span data-i18n="pied"></span>
      <a href="https://huggingface.co/kawkumputer" data-i18n="pied.lien"></a>.
      <span data-i18n="pied.suite"></span>
    </p>
    <p>
      <span data-i18n="pied.contact"></span>
      <a href="mailto:pulaartranslate@gmail.com">pulaartranslate@gmail.com</a>
    </p>
  </footer>

</div>

<script type="module">
import { LANGUES, PULAAR_PRET, t } from './i18n.js';

const $ = (id) => document.getElementById(id);
const source = $('source'), sortie = $('sortie'), etat = $('etat');
const btn = $('traduire'), direction = $('direction');
const barreLangues = $('langues');
const retour = $('retour'), retourForm = $('retour-form'), retourEtat = $('retour-etat');

// ── Langue de l'interface ─────────────────────────────────────────────────
// Le choix est mémorisé dans le navigateur. À défaut, on suit la langue du
// système si elle fait partie des langues proposées, sinon français.
const CLE = 'pulaar-translate.langue';

function langueInitiale() {
  try {
    const gardee = localStorage.getItem(CLE);
    if (gardee && LANGUES[gardee]) return gardee;
  } catch (e) { /* navigation privée : localStorage peut lever */ }
  const nav = (navigator.language || 'fr').slice(0, 2);
  return LANGUES[nav] ? nav : 'fr';
}

// Tant que le pulaar n'est pas complet, l'interface reste en français, même si
// un choix « pulaar » traîne dans le navigateur depuis une visite précédente.
let langue = PULAAR_PRET ? langueInitiale() : 'fr';

function appliquerLangue() {
  document.documentElement.lang = langue;
  document.title = t('doc.titre', langue);
  for (const el of document.querySelectorAll('[data-i18n]')) {
    el.textContent = t(el.dataset.i18n, langue);
  }
  source.placeholder = t('placeholder', langue);
  $('retour-correction').placeholder = t('retour.exemple', langue);
  if (sortie.classList.contains('vide')) {
    sortie.textContent = t('sortie.vide', langue);
  }
  // l'etiquette d'accessibilite du selecteur se traduit elle aussi
  barreLangues.setAttribute('aria-label', t('label.langue', langue));
  for (const b of document.querySelectorAll('#langues button')) {
    b.setAttribute('aria-pressed', String(b.dataset.langue === langue));
  }
  try { localStorage.setItem(CLE, langue); } catch (e) { /* ignoré */ }
}

if (PULAAR_PRET) {
  for (const [code, info] of Object.entries(LANGUES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.langue = code;
    b.textContent = info.etiquette;
    b.addEventListener('click', () => { langue = code; appliquerLangue(); });
    barreLangues.appendChild(b);
  }
} else {
  barreLangues.hidden = true;
}

// ── Traduction ────────────────────────────────────────────────────────────
source.addEventListener('input', () => {
  $('compteur').textContent = source.value.length;
});

function viderSortie() {
  sortie.classList.add('vide');
  sortie.textContent = t('sortie.vide', langue);
}

$('effacer').addEventListener('click', () => {
  source.value = '';
  viderSortie();
  etat.textContent = ''; etat.className = 'etat';
  $('compteur').textContent = '0';
  masquerRetour();
  source.focus();
});

// ── Retours des visiteurs ─────────────────────────────────────────────────
// `juge` fige le couple réellement affiché au moment de la traduction. Sans
// lui, un visiteur qui modifie le texte source avant de cliquer « Non »
// enverrait une correction portant sur une phrase que le modèle n'a jamais vue.
let juge = null;

function masquerRetour() {
  juge = null;
  retour.hidden = true;
  retourForm.hidden = true;
  retourEtat.textContent = '';
  retourEtat.className = 'retour-etat';
  $('retour-correction').value = '';
  for (const b of retour.querySelectorAll('.retour-choix button')) b.disabled = false;
}

async function envoyerRetour(verdict, correction) {
  if (!juge) return;
  retourEtat.textContent = '';
  retourEtat.className = 'retour-etat';
  try {
    const rep = await fetch('/api/retour', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        texte_source: juge.texte,
        direction: juge.direction,
        traduction_modele: juge.traduction,
        verdict,
        correction: correction || null,
        contributeur: $('retour-nom').value.trim() || null,
      }),
    });
    const data = await rep.json().catch(() => ({}));
    if (!rep.ok) {
      retourEtat.textContent = data.erreur || t('retour.echec', langue);
      retourEtat.className = 'retour-etat erreur';
      return;
    }
    retourEtat.textContent = t('retour.merci', langue);
    retourEtat.className = 'retour-etat ok';
    retourForm.hidden = true;
    for (const b of retour.querySelectorAll('.retour-choix button')) b.disabled = true;
  } catch (err) {
    retourEtat.textContent = t('etat.reseau', langue);
    retourEtat.className = 'retour-etat erreur';
  }
}

$('retour-oui').addEventListener('click', () => envoyerRetour('bonne', null));
$('retour-non').addEventListener('click', () => {
  retourForm.hidden = false;
  retourEtat.textContent = '';
  retourEtat.className = 'retour-etat';
  $('retour-correction').focus();
});
retourForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const propose = $('retour-correction').value.trim();
  if (!propose) {
    retourEtat.textContent = t('retour.vide', langue);
    retourEtat.className = 'retour-etat erreur';
    $('retour-correction').focus();
    return;
  }
  envoyerRetour('mauvaise', propose);
});

let chrono = null;
function demarrerChrono() {
  const debut = Date.now();
  etat.className = 'etat';
  const rendre = () => {
    const s = Math.round((Date.now() - debut) / 1000);
    // 15 s : depuis le chargement du modele en float16, dix mesures donnent une
    // mediane de 0,7 s et un maximum de 4,8 s. Au-dela de 15 s, ce n'est plus
    // une traduction lente, c'est un service qui se reveille.
    etat.textContent = s < 15
      ? `${t('etat.encours', langue)} ${s} s`
      : `${t('etat.longue', langue)} ${s} s`;
  };
  rendre();
  chrono = setInterval(rendre, 1000);
}
function arreterChrono() { if (chrono) { clearInterval(chrono); chrono = null; } }

async function traduire() {
  const texte = source.value.trim();
  if (!texte) { source.focus(); return; }

  btn.disabled = true;
  sortie.classList.remove('vide');
  sortie.textContent = '';
  masquerRetour();
  demarrerChrono();
  try {
    const rep = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texte, direction: direction.value }),
    });
    const data = await rep.json();
    arreterChrono();
    if (!rep.ok) {
      etat.textContent = data.erreur || t('etat.echec', langue);
      etat.className = 'etat erreur';
      viderSortie();
      return;
    }
    sortie.textContent = data.traduction;
    etat.textContent = t('etat.termine', langue);
    etat.className = 'etat';
    // `data.retours` vaut false tant que Supabase n'est pas configuré : mieux
    // vaut pas de bloc du tout qu'un bouton qui répond « pas encore activé ».
    if (data.retours) {
      juge = { texte, direction: direction.value, traduction: data.traduction };
      retour.hidden = false;
    }
  } catch (err) {
    arreterChrono();
    etat.textContent = t('etat.reseau', langue);
    etat.className = 'etat erreur';
    viderSortie();
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener('click', traduire);
source.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') traduire();
});

appliquerLangue();
</script>
</body>
</html>
